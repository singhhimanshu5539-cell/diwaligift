<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="rbg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f0933"/>
      <stop offset="70%" stop-color="#0b0314"/>
      <stop offset="100%" stop-color="#04010a"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#rbg)" />

  <g transform="translate(300, 300)">
    <!-- Ambient Ring Glow -->
    <circle cx="0" cy="0" r="230" fill="url(#centerGlow)" opacity="0.25" />

    <!-- Outer Marigold Petals (16 petals) -->
    <g fill="#ea580c" stroke="#fef08a" stroke-width="1.5">
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(22.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(45)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(67.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(90)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(112.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(135)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(157.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(180)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(202.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(225)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(247.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(270)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(292.5)" fill="#f59e0b" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(315)" />
      <path d="M0 -220 C25 -190 25 -160 0 -140 C-25 -160 -25 -190 0 -220 Z" transform="rotate(337.5)" fill="#f59e0b" />
    </g>

    <!-- Crimson Mandala Layer -->
    <circle cx="0" cy="0" r="145" fill="#be123c" stroke="#fbbf24" stroke-width="3" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Royal Lotus Petals (8 petals) -->
    <g fill="#9333ea" stroke="#fbbf24" stroke-width="2">
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(45)" fill="#db2777" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(90)" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(135)" fill="#db2777" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(180)" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(225)" fill="#db2777" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(270)" />
      <path d="M0 -130 C30 -100 30 -60 0 -40 C-30 -60 -30 -100 0 -130 Z" transform="rotate(315)" fill="#db2777" />
    </g>

    <!-- Golden Peacock Cyan Ring -->
    <circle cx="0" cy="0" r="50" fill="#0284c7" stroke="#fef08a" stroke-width="2.5" />

    <!-- Center Glowing Sun Diya -->
    <circle cx="0" cy="0" r="28" fill="#fbbf24" />
    <circle cx="0" cy="0" r="16" fill="#fef08a" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>
</svg>

