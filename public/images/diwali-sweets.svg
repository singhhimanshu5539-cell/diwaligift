<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="swbg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#240c38"/>
      <stop offset="70%" stop-color="#11041c"/>
      <stop offset="100%" stop-color="#05010a"/>
    </radialGradient>
    <radialGradient id="brassThali" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="laddu" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="silverVark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#swbg)" />

  <!-- Shadow below Thali -->
  <ellipse cx="300" cy="360" rx="220" ry="85" fill="#000000" opacity="0.5" />

  <!-- Royal Brass / Golden Thali Plate -->
  <ellipse cx="300" cy="330" rx="220" ry="110" fill="url(#brassThali)" stroke="#fef08a" stroke-width="4" />
  <ellipse cx="300" cy="328" rx="200" ry="98" fill="#92400e" stroke="#fbbf24" stroke-width="2" />
  <ellipse cx="300" cy="326" rx="190" ry="92" fill="#78350f" />

  <!-- Engraved rim dots on Thali -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="115" cy="330" r="3"/>
    <circle cx="150" cy="380" r="3"/>
    <circle cx="220" cy="415" r="3"/>
    <circle cx="300" cy="425" r="3"/>
    <circle cx="380" cy="415" r="3"/>
    <circle cx="450" cy="380" r="3"/>
    <circle cx="485" cy="330" r="3"/>
    <circle cx="450" cy="275" r="3"/>
    <circle cx="380" cy="240" r="3"/>
    <circle cx="300" cy="232" r="3"/>
    <circle cx="220" cy="240" r="3"/>
    <circle cx="150" cy="275" r="3"/>
  </g>

  <!-- Kaju Katli (Diamond shaped silver sweet) -->
  <g transform="translate(240, 290)">
    <polygon points="0,-25 35,0 0,25 -35,0" fill="url(#silverVark)" stroke="#64748b" stroke-width="1.5" />
    <polygon points="50,-20 85,5 50,30 15,5" fill="url(#silverVark)" stroke="#64748b" stroke-width="1.5" />
    <polygon points="100,-15 135,10 100,35 65,10" fill="url(#silverVark)" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Motichoor Laddus (Golden round sweets with pistachio flakes) -->
  <!-- Back row laddus -->
  <g>
    <circle cx="260" cy="340" r="28" fill="url(#laddu)" stroke="#b45309" stroke-width="1" />
    <circle cx="340" cy="340" r="28" fill="url(#laddu)" stroke="#b45309" stroke-width="1" />
    <!-- Front row laddus -->
    <circle cx="220" cy="365" r="28" fill="url(#laddu)" stroke="#b45309" stroke-width="1" />
    <circle cx="300" cy="370" r="30" fill="url(#laddu)" stroke="#b45309" stroke-width="1" />
    <circle cx="380" cy="365" r="28" fill="url(#laddu)" stroke="#b45309" stroke-width="1" />
    <!-- Pistachio & saffron garnish on laddus -->
    <circle cx="300" cy="358" r="3" fill="#15803d" />
    <circle cx="304" cy="362" r="2" fill="#e11d48" />
    <circle cx="220" cy="355" r="3" fill="#15803d" />
    <circle cx="380" cy="355" r="3" fill="#15803d" />
  </g>

  <!-- Fresh Marigold Flowers on the side -->
  <g transform="translate(160, 310)">
    <circle cx="0" cy="0" r="16" fill="#f97316" />
    <circle cx="0" cy="0" r="10" fill="#fbbf24" />
    <circle cx="0" cy="0" r="5" fill="#fef08a" />
  </g>
  <g transform="translate(440, 315)">
    <circle cx="0" cy="0" r="16" fill="#f97316" />
    <circle cx="0" cy="0" r="10" fill="#fbbf24" />
    <circle cx="0" cy="0" r="5" fill="#fef08a" />
  </g>
</svg>
